<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Game History</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=Outfit:wght@400;600;700&display=swap"
		rel="stylesheet"
	/>
	<style>
		:root {
			--bg-main: #07111c;
			--bg-panel: rgba(11, 24, 40, 0.76);
			--bg-soft: rgba(255, 255, 255, 0.07);
			--text-main: #eef7ff;
			--text-muted: #9bb6ce;
			--accent-a: #1df4d4;
			--accent-b: #44a7ff;
			--accent-c: #ffb347;
			--danger: #ff6d8c;
			--border: rgba(255, 255, 255, 0.15);
			--shadow-lg: 0 24px 50px rgba(0, 0, 0, 0.35);
			--radius-lg: 24px;
			--radius-md: 14px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Outfit", sans-serif;
			color: var(--text-main);
			background:
				radial-gradient(circle at 10% 12%, rgba(29, 244, 212, 0.26), transparent 36%),
				radial-gradient(circle at 88% 20%, rgba(68, 167, 255, 0.24), transparent 34%),
				radial-gradient(circle at 45% 85%, rgba(255, 179, 71, 0.18), transparent 38%),
				linear-gradient(145deg, #05101a 0%, #08192b 50%, #0d1522 100%);
			overflow-x: hidden;
		}

		.noise {
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: 0.2;
			z-index: 0;
			background-image: radial-gradient(rgba(255, 255, 255, 0.08) 0.4px, transparent 0.4px);
			background-size: 4px 4px;
		}

		.orb {
			position: fixed;
			width: 340px;
			height: 340px;
			border-radius: 50%;
			filter: blur(84px);
			opacity: 0.28;
			z-index: 0;
			animation: float 18s ease-in-out infinite;
		}

		.orb.one {
			background: #1df4d4;
			top: -120px;
			left: -90px;
		}

		.orb.two {
			background: #44a7ff;
			right: -120px;
			top: 28%;
			animation-delay: -5s;
		}

		.orb.three {
			background: #ffb347;
			left: 30%;
			bottom: -130px;
			animation-delay: -10s;
		}

		.app {
			position: relative;
			z-index: 1;
			width: min(1160px, 94vw);
			margin: 34px auto;
			display: grid;
			gap: 18px;
			animation: enter 700ms ease-out;
		}

		.hero {
			padding: 26px;
			border-radius: var(--radius-lg);
			border: 1px solid var(--border);
			background: var(--bg-panel);
			backdrop-filter: blur(18px);
			box-shadow: var(--shadow-lg);
			display: flex;
			flex-wrap: wrap;
			align-items: flex-start;
			justify-content: space-between;
			gap: 16px;
		}

		.title {
			margin: 0;
			font-family: "Bricolage Grotesque", sans-serif;
			font-size: clamp(1.8rem, 4.5vw, 3rem);
			line-height: 1.06;
		}

		.subtitle {
			margin: 8px 0 0;
			font-size: 0.98rem;
			color: var(--text-muted);
		}

		.pills {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.pill {
			padding: 10px 14px;
			border-radius: 999px;
			border: 1px solid var(--border);
			background: var(--bg-soft);
			font-size: 0.88rem;
			white-space: nowrap;
		}

		.refresh-btn {
			border: 0;
			border-radius: 12px;
			padding: 10px 16px;
			font-family: inherit;
			font-weight: 700;
			color: #052029;
			cursor: pointer;
			background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
			box-shadow: 0 12px 24px rgba(29, 244, 212, 0.3);
			transition: transform 160ms ease, box-shadow 160ms ease;
		}

		.refresh-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 14px 26px rgba(68, 167, 255, 0.32);
		}

		.refresh-btn:active {
			transform: translateY(0);
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 12px;
		}

		.stat-card {
			padding: 14px;
			border-radius: var(--radius-md);
			border: 1px solid var(--border);
			background: linear-gradient(150deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
		}

		.stat-label {
			color: var(--text-muted);
			font-size: 0.82rem;
			margin-bottom: 6px;
		}

		.stat-value {
			font-family: "Bricolage Grotesque", sans-serif;
			font-size: 1.45rem;
			font-weight: 700;
		}

		.panel {
			padding: 16px;
			border-radius: var(--radius-lg);
			border: 1px solid var(--border);
			background: var(--bg-panel);
			backdrop-filter: blur(14px);
		}

		.section-title {
			margin: 0 0 14px;
			font-family: "Bricolage Grotesque", sans-serif;
			font-size: 1.25rem;
		}

		.state {
			padding: 34px 18px;
			text-align: center;
			color: var(--text-muted);
		}

		.state.error {
			color: var(--danger);
		}

		.top-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 12px;
			margin-bottom: 16px;
		}

		.top-card {
			padding: 14px;
			border-radius: var(--radius-md);
			border: 1px solid var(--border);
			background: linear-gradient(165deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
			position: relative;
			overflow: hidden;
			opacity: 0;
			transform: translateY(8px);
			animation: reveal 420ms ease forwards;
		}

		.top-card::after {
			content: "";
			position: absolute;
			inset: auto -16% -44% 20%;
			height: 130px;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(29, 244, 212, 0.26), transparent 70%);
			pointer-events: none;
		}

		.rank-tag {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			font-weight: 700;
			color: #04222b;
			background: linear-gradient(140deg, var(--accent-a), var(--accent-c));
		}

		.player-name {
			margin: 10px 0 8px;
			font-family: "Bricolage Grotesque", sans-serif;
			font-size: 1.08rem;
		}

		.meta-row {
			display: flex;
			justify-content: space-between;
			gap: 10px;
			font-size: 0.9rem;
			margin-top: 7px;
		}

		.muted {
			color: var(--text-muted);
		}

		.table-wrap {
			overflow: auto;
			border-radius: 12px;
			border: 1px solid var(--border);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 980px;
			font-size: 0.93rem;
		}

		th,
		td {
			padding: 12px 13px;
			text-align: left;
			border-bottom: 1px solid rgba(255, 255, 255, 0.09);
		}

		th {
			font-size: 0.78rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: #b8d2ea;
			background: rgba(0, 0, 0, 0.25);
		}

		tbody tr:hover {
			background: rgba(255, 255, 255, 0.06);
		}

		@keyframes float {
			0%,
			100% {
				transform: translate(0, 0) scale(1);
			}
			50% {
				transform: translate(30px, -22px) scale(1.06);
			}
		}

		@keyframes enter {
			from {
				opacity: 0;
				transform: translateY(14px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes reveal {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 760px) {
			.app {
				margin: 18px auto;
			}

			.hero {
				padding: 18px;
			}

			.panel {
				padding: 12px;
			}

			.pill {
				font-size: 0.8rem;
			}
		}
	</style>
</head>
<body>
	<div class="noise"></div>
	<div class="orb one"></div>
	<div class="orb two"></div>
	<div class="orb three"></div>

	<main class="app">
		<section class="hero">
			<div>
				<h1 class="title">Mini Golf Match History</h1>
				<p class="subtitle">Past rounds, top scores, and game sessions in one live view.</p>
			</div>
			<div class="pills">
				<span id="countPill" class="pill">Matches: 0</span>
				<span id="syncPill" class="pill">Last Sync: --</span>
				<button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
			</div>
		</section>

		<section class="stats-grid">
			<article class="stat-card">
				<div class="stat-label">Best Score</div>
				<div id="bestScoreValue" class="stat-value">--</div>
			</article>
			<article class="stat-card">
				<div class="stat-label">Avg Score</div>
				<div id="avgScoreValue" class="stat-value">--</div>
			</article>
			<article class="stat-card">
				<div class="stat-label">Unique Players</div>
				<div id="playersValue" class="stat-value">--</div>
			</article>
			<article class="stat-card">
				<div class="stat-label">Latest Session</div>
				<div id="latestSessionValue" class="stat-value">--</div>
			</article>
		</section>

		<section class="panel">
			<div id="state" class="state">Loading history...</div>
			<div id="content" hidden>
				<h2 class="section-title">Top Performances</h2>
				<div id="topGrid" class="top-grid"></div>

				<h2 class="section-title">All Matches</h2>
				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th>#</th>
								<th>Name</th>
								<th>Final Score</th>
								<th>Holes</th>
								<th>Ball</th>
								<th>Putter</th>
								<th>Player ID</th>
								<th>Game ID</th>
								<th>Start</th>
								<th>End</th>
								<th>Duration</th>
							</tr>
						</thead>
						<tbody id="historyTableBody"></tbody>
					</table>
				</div>
			</div>
		</section>
	</main>

	<script>
		const API_URL = "https://app.forcempower.com/minigolf/api/v4/history.php";
		const REFRESH_MS = 45000;

		const stateEl = document.getElementById("state");
		const contentEl = document.getElementById("content");
		const topGridEl = document.getElementById("topGrid");
		const tableBodyEl = document.getElementById("historyTableBody");
		const countPillEl = document.getElementById("countPill");
		const syncPillEl = document.getElementById("syncPill");
		const bestScoreEl = document.getElementById("bestScoreValue");
		const avgScoreEl = document.getElementById("avgScoreValue");
		const playersEl = document.getElementById("playersValue");
		const latestSessionEl = document.getElementById("latestSessionValue");
		const refreshBtnEl = document.getElementById("refreshBtn");

		function safeText(value, fallback = "-") {
			return value === null || value === undefined || value === "" ? fallback : String(value);
		}

		function toNumber(value, fallback = 0) {
			const numeric = Number(value);
			return Number.isFinite(numeric) ? numeric : fallback;
		}

		function formatDateTime(value) {
			if (!value) {
				return "-";
			}
			const parsed = new Date(String(value).replace(" ", "T"));
			if (Number.isNaN(parsed.getTime())) {
				return safeText(value);
			}
			return parsed.toLocaleString([], {
				month: "short",
				day: "numeric",
				hour: "numeric",
				minute: "2-digit",
				hour12: true
			});
		}

		function formatDuration(startValue, endValue) {
			const start = new Date(String(startValue || "").replace(" ", "T"));
			const end = new Date(String(endValue || "").replace(" ", "T"));
			if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end < start) {
				return "-";
			}

			const totalSeconds = Math.floor((end - start) / 1000);
			const hours = Math.floor(totalSeconds / 3600);
			const minutes = Math.floor((totalSeconds % 3600) / 60);
			const seconds = totalSeconds % 60;

			if (hours > 0) {
				return `${hours}h ${minutes}m`;
			}
			if (minutes > 0) {
				return `${minutes}m ${seconds}s`;
			}
			return `${seconds}s`;
		}

		function parseAdditionalStats(rawValue) {
			if (!rawValue) {
				return {};
			}
			if (typeof rawValue === "object") {
				return rawValue;
			}
			try {
				return JSON.parse(rawValue);
			} catch (error) {
				return {};
			}
		}

		function setState(message, isError = false) {
			stateEl.hidden = false;
			contentEl.hidden = true;
			stateEl.textContent = message;
			stateEl.classList.toggle("error", isError);
		}

		function updateStats(matches) {
			if (!matches.length) {
				bestScoreEl.textContent = "--";
				avgScoreEl.textContent = "--";
				playersEl.textContent = "--";
				latestSessionEl.textContent = "--";
				return;
			}

			const validScores = matches
				.map((match) => toNumber(match.final_score, NaN))
				.filter((score) => Number.isFinite(score) && score > 0);

			const uniquePlayers = new Set(matches.map((match) => safeText(match.name, "Unknown")));
			const latestMatch = [...matches].sort((a, b) => {
				const timeA = new Date(String(a.end_time || a.create_date || "").replace(" ", "T")).getTime();
				const timeB = new Date(String(b.end_time || b.create_date || "").replace(" ", "T")).getTime();
				return timeB - timeA;
			})[0];

			bestScoreEl.textContent = validScores.length ? String(Math.min(...validScores)) : "--";
			avgScoreEl.textContent = validScores.length
				? (validScores.reduce((sum, score) => sum + score, 0) / validScores.length).toFixed(1)
				: "--";
			playersEl.textContent = String(uniquePlayers.size);
			latestSessionEl.textContent = formatDateTime(latestMatch.end_time || latestMatch.create_date);
		}

		function renderHistory(matches) {
			topGridEl.innerHTML = "";
			tableBodyEl.innerHTML = "";

			if (!matches.length) {
				setState("No match history available yet.");
				countPillEl.textContent = "Matches: 0";
				updateStats([]);
				return;
			}

			const sortedMatches = [...matches].sort((a, b) => {
				const scoreA = toNumber(a.final_score, Number.POSITIVE_INFINITY);
				const scoreB = toNumber(b.final_score, Number.POSITIVE_INFINITY);
				if (scoreA !== scoreB) {
					return scoreA - scoreB;
				}

				const timeA = new Date(String(a.end_time || a.create_date || "").replace(" ", "T")).getTime();
				const timeB = new Date(String(b.end_time || b.create_date || "").replace(" ", "T")).getTime();
				return timeB - timeA;
			});

			const topPerformers = sortedMatches.slice(0, 3);
			topPerformers.forEach((match, index) => {
				const notes = parseAdditionalStats(match.additional_stats).notes;
				const card = document.createElement("article");
				card.className = "top-card";
				card.style.animationDelay = `${Math.min(index * 80, 240)}ms`;
				card.innerHTML = `
					<span class="rank-tag">#${index + 1}</span>
					<h3 class="player-name">${safeText(match.name, "Unknown Player")}</h3>
					<div class="meta-row"><span class="muted">Score</span><strong>${toNumber(match.final_score, 0)}</strong></div>
					<div class="meta-row"><span class="muted">Holes</span><strong>${toNumber(match.total_holes, 0)}</strong></div>
					<div class="meta-row"><span class="muted">Ended</span><strong>${formatDateTime(match.end_time)}</strong></div>
					<div class="meta-row"><span class="muted">Note</span><strong>${safeText(notes, "-")}</strong></div>
				`;
				topGridEl.appendChild(card);
			});

			const byLatest = [...matches].sort((a, b) => {
				const timeA = new Date(String(a.end_time || a.create_date || "").replace(" ", "T")).getTime();
				const timeB = new Date(String(b.end_time || b.create_date || "").replace(" ", "T")).getTime();
				return timeB - timeA;
			});

			byLatest.forEach((match, index) => {
				const row = document.createElement("tr");
				row.innerHTML = `
					<td>${index + 1}</td>
					<td>${safeText(match.name, "Unknown Player")}</td>
					<td>${toNumber(match.final_score, 0)}</td>
					<td>${toNumber(match.total_holes, 0)}</td>
					<td>${safeText(match.ball_id)}</td>
					<td>${safeText(match.putter_id)}</td>
					<td>${safeText(match.player_id)}</td>
					<td>${safeText(match.game_id)}</td>
					<td>${formatDateTime(match.start_time)}</td>
					<td>${formatDateTime(match.end_time)}</td>
					<td>${formatDuration(match.start_time, match.end_time)}</td>
				`;
				tableBodyEl.appendChild(row);
			});

			countPillEl.textContent = `Matches: ${matches.length}`;
			syncPillEl.textContent = `Last Sync: ${new Date().toLocaleTimeString()}`;
			updateStats(matches);
			stateEl.hidden = true;
			contentEl.hidden = false;
		}

		async function loadHistory() {
			setState("Loading history...");

			try {
				const response = await fetch(API_URL, {
					method: "GET",
					headers: {
						Accept: "application/json"
					},
					cache: "no-store"
				});

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`);
				}

				const payload = await response.json();
				const matches = Array.isArray(payload.data) ? payload.data : [];
				renderHistory(matches);
			} catch (error) {
				console.error("Failed to fetch history:", error);
				setState("Could not load history. Check API access and CORS settings.", true);
			}
		}

		refreshBtnEl.addEventListener("click", loadHistory);
		loadHistory();
		window.setInterval(loadHistory, REFRESH_MS);
	</script>
</body>
</html>
